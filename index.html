<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="living in the moment. creating something real." />
  <meta name="theme-color" content="#a855f7" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="zaza — personal" />
  <meta property="og:description" content="living in the moment. creating something real." />
  <meta property="og:image" content="assets/images/avatar.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <title>zaza — personal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<!-- Cursor -->
<div id="cursor"></div>
<div id="cursor-follower"></div>
<div id="mouse-light"></div>

<!-- Terminal Loading Screen -->
<div id="loading-screen">
  <div class="terminal-window">
    <div class="terminal-bar">
      <span class="term-dot red"></span>
      <span class="term-dot yellow"></span>
      <span class="term-dot green"></span>
      <span class="term-title">zaza@system ~ boot</span>
    </div>
    <div class="terminal-body" id="terminal-body"></div>
  </div>
</div>

<!-- Background -->
<div id="bg-layer">
  <video id="bg-video" autoplay muted loop playsinline style="display:none;"></video>
  <div id="bg-image-wrap"></div>
  <div id="bg-overlay"></div>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
</div>
<canvas id="particles-canvas"></canvas>

<!-- Enter Screen -->
<div id="enter-screen">
  <h1 class="enter-title">zaza</h1>
  <p class="enter-sub">click to enter</p>
  <button id="enter-btn" class="enter-btn"><span>enter</span></button>
</div>

<!-- Announcement Banner -->
<div class="ann-banner hidden" id="ann-banner">
  <div class="ann-inner">
    <span class="ann-emoji" id="ann-emoji">📢</span>
    <span class="ann-text" id="ann-text"></span>
  </div>
  <button class="ann-close" id="ann-close" aria-label="Close banner"><i class="fas fa-xmark"></i></button>
</div>

<!-- Main Page -->
<main id="main-page">
  <div class="layout">

    <!-- LEFT -->
    <div class="profile-left">
      <div class="section-eyebrow">about me</div>

      <div class="name-row">
        <div class="avatar-wrap" id="avatar-wrap">
          <div class="avatar-ring"></div>
          <div class="avatar-initial" id="avatar-el">Z</div>
          <span class="online-dot" id="online-dot"></span>
        </div>
        <div class="name-text-wrap">
          <div class="name-greeting">hi, my name is</div>
          <div class="name-main" id="profile-username">zaza</div>
        </div>
      </div>

      <p class="bio-text" id="profile-bio">living in the moment. creating something real.</p>

      <div class="badges-row" id="badges-row"></div>

      <!-- Discord Presence Panel -->
      <div class="discord-panel" id="discord-panel" style="display:none;">
        <div class="discord-card dc-connecting" id="dc-card">
          <div class="dc-avatar-wrap">
            <div class="dc-avatar-initial" id="dc-avatar-wrap-inner">Z</div>
            <span class="dc-status-dot offline" id="dc-status-dot"></span>
          </div>
          <div class="dc-info">
            <div class="dc-label">discord</div>
            <div class="dc-username" id="dc-username">connecting...</div>
            <div class="dc-status-text" id="dc-status-text">loading presence</div>
          </div>
          <i class="fab fa-discord dc-logo"></i>
        </div>
        <div class="discord-activity" id="dc-activity">
          <div class="dc-act-img-wrap">
            <div class="dc-act-placeholder" id="dc-act-placeholder">🎮</div>
            <img class="dc-act-img" id="dc-act-img" src="" alt="" style="display:none;"/>
            <img class="dc-act-small-img" id="dc-act-small-img" src="" alt="" style="display:none;"/>
          </div>
          <div class="dc-act-info">
            <div class="dc-act-type" id="dc-act-type">Playing</div>
            <div class="dc-act-name" id="dc-act-name">—</div>
            <div class="dc-act-detail" id="dc-act-detail"></div>
            <div class="dc-act-state" id="dc-act-state"></div>
          </div>
          <div class="dc-act-elapsed" id="dc-act-elapsed"></div>
        </div>
        <div class="discord-spotify" id="dc-spotify">
          <img class="dc-sp-cover" id="dc-sp-cover" src="" alt=""/>
          <div class="dc-sp-info">
            <div class="dc-sp-label">listening on spotify</div>
            <div class="dc-sp-track" id="dc-sp-track">—</div>
            <div class="dc-sp-artist" id="dc-sp-artist">—</div>
          </div>
          <div class="dc-sp-bars">
            <span></span><span></span><span></span><span></span>
          </div>
        </div>
      </div>

      <!-- Spotify Now Playing -->
      <div class="spotify-widget" id="spotify-widget" style="display:none;">
        <div class="spotify-icon"><i class="fab fa-spotify"></i></div>
        <div class="spotify-info">
          <div class="spotify-label">now playing</div>
          <div class="spotify-track" id="spotify-track">—</div>
          <div class="spotify-artist" id="spotify-artist">—</div>
        </div>
        <div class="spotify-bars" id="spotify-bars">
          <span></span><span></span><span></span><span></span>
        </div>
      </div>
      <!-- Spotify not playing fallback -->
      <div class="spotify-widget spotify-idle" id="spotify-idle" style="display:none;">
        <div class="spotify-icon"><i class="fab fa-spotify"></i></div>
        <div class="spotify-info">
          <div class="spotify-label">spotify</div>
          <div class="spotify-track" id="spotify-idle-text">not playing</div>
        </div>
      </div>
    </div>

    <!-- RIGHT -->
    <div class="profile-right">
      <div class="right-eyebrow">find me at</div>
      <div class="status-pill">
        <span class="status-dot online" id="status-dot"></span>
        <span id="status-typewriter"></span><span class="tw-cursor"></span>
      </div>
      <div class="social-list" id="socials-container"></div>
    </div>

  </div>
</main>

<!-- Music Bar -->
<div class="music-bar" id="music-bar" style="display:none;">
  <div class="music-cover-mini" id="music-cover-mini"><i class="fas fa-music"></i></div>
  <div class="music-info-mini">
    <div class="music-title-mini" id="music-title-mini">No track</div>
    <div class="music-artist-mini" id="music-artist-mini">—</div>
  </div>
  <div class="music-progress-mini" id="music-progress-mini">
    <div class="music-progress-fill-mini" id="music-progress-fill-mini"></div>
  </div>
  <span style="font-size:.65rem;color:var(--text-muted);min-width:32px;" id="music-time-mini">0:00</span>
  <div class="music-controls-mini">
    <button class="music-btn-mini" id="prev-btn"><i class="fas fa-backward-step"></i></button>
    <button class="music-btn-mini play-btn" id="play-pause-btn"><i class="fas fa-play"></i></button>
    <button class="music-btn-mini" id="next-btn"><i class="fas fa-forward-step"></i></button>
  </div>
  <canvas id="visualizer-canvas" width="80" height="24"></canvas>
  <div class="vol-row">
    <i class="fas fa-volume-high" id="volume-icon"></i>
    <input type="range" class="vol-slider" id="volume-slider" min="0" max="1" step="0.01" value="0.5" />
  </div>
</div>

<!-- Theme FAB -->
<button class="theme-fab" id="theme-fab" title="Change theme" aria-label="Change accent color" style="opacity:0;pointer-events:none;">
  <i class="fas fa-palette"></i>
</button>

<!-- Copy toast -->
<div id="copy-toast" class="copy-toast">copied!</div>

<!-- Admin link -->
<a href="admin.html" class="admin-corner-link">admin</a>

<!-- Custom context menu -->
<div id="ctx-menu" role="menu" aria-label="Site menu"></div>
