<body>

<!-- Cursor -->
<div id="cursor"></div>
<div id="cursor-follower"></div>
<div id="mouse-light"></div>

<!-- Loading -->
<div id="loading-screen">
  <div class="loader-logo">zaza</div>
  <div class="loader-bar-wrap"><div class="loader-bar"></div></div>
  <div class="loader-text">loading...</div>
</div>

<!-- Background -->
<div id="bg-layer">
  <video id="bg-video" autoplay muted loop playsinline style="display:none;"></video>
  <div id="bg-image-wrap"></div>
  <div id="bg-overlay"></div>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
</div>
<canvas id="particles-canvas"></canvas>

<!-- Enter Screen -->
<div id="enter-screen">
  <h1 class="enter-title">zaza</h1>
  <p class="enter-sub">click to enter</p>
  <button id="enter-btn" class="enter-btn"><span>enter</span></button>
</div>

<!-- Main Page -->
<main id="main-page">
  <div class="layout">

    <!-- ═══ LEFT ═══ -->
    <div class="profile-left">
      <div class="section-eyebrow">about me</div>

      <div class="name-row">
        <div class="avatar-wrap" id="avatar-wrap">
          <div class="avatar-ring"></div>
          <div class="avatar-initial" id="avatar-el">Z</div>
          <span class="online-dot" id="online-dot"></span>
        </div>
        <div class="name-text-wrap">
          <div class="name-greeting">hey, i'm</div>
          <div class="name-main" id="profile-username">zaza</div>
        </div>
      </div>

      <p class="bio-text" id="profile-bio">living in the moment. creating something real.</p>

      <div class="badges-row" id="badges-row">
        <!-- Populated by JS -->
      </div>

      <div class="stats-strip">
        <div class="stat-item">
          <span class="stat-value" id="stat-visits">—</span>
          <span class="stat-label">visitors</span>
        </div>
        <div class="stat-sep"></div>
        <div class="stat-item">
          <span class="stat-value" id="stat-views">—</span>
          <span class="stat-label">views</span>
        </div>
        <div class="stat-sep"></div>
        <div class="stat-item">
          <span class="stat-value" id="stat-since">—</span>
          <span class="stat-label">since</span>
        </div>
      </div>
    </div>

    <!-- ═══ RIGHT ═══ -->
    <div class="profile-right">
      <div class="right-eyebrow">find me at</div>

      <!-- Status -->
      <div class="status-pill">
        <span class="status-dot online" id="status-dot"></span>
        <span id="status-typewriter"></span><span class="tw-cursor"></span>
      </div>

      <!-- Socials -->
      <div class="social-list" id="socials-container">
        <!-- Populated by JS -->
      </div>
    </div>

  </div>
</main>

<!-- Music Bar -->
<div class="music-bar" id="music-bar" style="display:none;">
  <div class="music-cover-mini" id="music-cover-mini"><i class="fas fa-music"></i></div>
  <div class="music-info-mini">
    <div class="music-title-mini" id="music-title-mini">No track</div>
    <div class="music-artist-mini" id="music-artist-mini">—</div>
  </div>
  <div class="music-progress-mini" id="music-progress-mini">
    <div class="music-progress-fill-mini" id="music-progress-fill-mini"></div>
  </div>
  <span style="font-size:.65rem;color:var(--text-muted);min-width:32px;" id="music-time-mini">0:00</span>
  <div class="music-controls-mini">
    <button class="music-btn-mini" id="prev-btn"><i class="fas fa-backward-step"></i></button>
    <button class="music-btn-mini play" id="play-pause-btn"><i class="fas fa-play"></i></button>
    <button class="music-btn-mini" id="next-btn"><i class="fas fa-forward-step"></i></button>
  </div>
  <canvas id="visualizer-canvas" width="80" height="24"></canvas>
  <div class="music-vol-mini">
    <i class="fas fa-volume-high" id="volume-icon"></i>
    <input type="range" class="vol-slider-mini" id="volume-slider" min="0" max="1" step="0.01" value="0.5" />
  </div>
</div>

<!-- Theme FAB -->
<button class="theme-fab" id="theme-fab" title="Change theme" aria-label="Change accent color">
  <i class="fas fa-palette"></i>
</button>

<!-- Keyboard hint -->
<div class="kbd-hint" id="kbd-hint">
  <span class="kbd">space</span> play/pause &nbsp;
  <span class="kbd">alt+→</span> next &nbsp;
  <span class="kbd">M</span> mute
</div>
