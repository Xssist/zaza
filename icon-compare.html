<!doctype html>
<html>
  <head>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <style>
      body {
        background: #0a0a0f;
        color: #fff;
        font-family: monospace;
        padding: 20px;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 0.48rem;
        min-height: 30px;
        padding: 0.3rem 0.72rem;
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.025);
        font-size: 0.75rem;
        font-weight: 600;
        color: rgba(244, 244, 240, 0.73);
        margin: 10px;
      }
      .chip i {
        width: 1rem;
        text-align: center;
        font-size: 0.86rem;
        color: #a0a0a0;
      }
      .chip img {
        width: 14px;
        height: 14px;
        object-fit: contain;
      }
      .big {
        transform: scale(4);
        transform-origin: left top;
        margin-bottom: 120px;
      }
    </style>
  </head>
  <body>
    <div>
      <span class="chip"><i class="fab fa-js"></i> JavaScript</span>
      <span class="chip"
        ><img src="assets/images/typescript.svg" /> TypeScript</span
      >
    </div>
    <div class="big">
      <span class="chip"><i class="fab fa-js"></i> JavaScript</span>
      <span class="chip"
        ><img src="assets/images/typescript.svg" /> TypeScript</span
      >
    </div>
  </body>
</html>
